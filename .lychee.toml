# Link check of the built site (`just check-doc-links`, and lychee-action in docs.yml).
fallback_extensions = ["html"]
no_progress = true
max_retries = 2
timeout = 20
# rate limiting and crawler blocking (e.g. journals, doi.org) are not broken links
accept = [200, 403, 429]
# mkdocs-material's 404 page uses root-relative links (/AEGISS/...) that only resolve when served
exclude_path = ["site/404.html"]
exclude = [
  "^http://(localhost|127\\.0\\.0\\.1)",
  # the repository is internal until the release; remove once it is public
  "^https://github\\.com/Algorithmiq/AEGISS",
  # canonical/og self-links point at the deployed site, not this build; internal links are checked as files
  "^https://algorithmiq\\.github\\.io/AEGISS",
]
