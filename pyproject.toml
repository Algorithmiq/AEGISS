[project]
name = "aegiss"
dynamic = ["version"]
authors = [
    { name = "Algorithmiq Development Team", email = "info@algorithmiq.fi" },
]
description = "AEGISS: Atomic Orbital and Entropy based Guided Inference for Space Selection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# block2 publishes wheels up to CPython 3.14
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "block2==0.5.4",
    "matplotlib>=3.9",
    "pyscf>=2.12.1",
    "seaborn>=0.13",
    "structlog>=25.5.0",
]

[project.urls]
Homepage = "https://algorithmiq.github.io/AEGISS/"
Documentation = "https://algorithmiq.github.io/AEGISS/"
Repository = "https://github.com/Algorithmiq/AEGISS"
"Bug Tracker" = "https://github.com/Algorithmiq/AEGISS/issues"
Discussions = "https://github.com/Algorithmiq/AEGISS/discussions"
Changelog = "https://github.com/Algorithmiq/AEGISS/blob/main/CHANGELOG.md"

[project.scripts]
aegiss = "aegiss.cli:main"

[project.optional-dependencies]
viz = [
    "ase",
    "pyvista",
    "pyvistaqt",
    "qtpy",
    "pyside6-essentials>=6.5",  # QtCore/QtGui/QtWidgets only; LGPL-3.0
]

[dependency-groups]
docs = [
    "mike>=2.1",
    "mkdocs-material>=9",
    "mkdocs-jupyter>=0.25",
    "mkdocstrings[python]>=0.27",
]
dev = [
    "prek>=0.5",
    "ruff==0.17.1",
    "ty==0.0.89",
    { include-group = "test" },
]
test = [
    "ase>=3",
    "pytest>=8.2.2,<10.0",
    "pytest-cov>=4.0",
    "pytest-markdown-docs>=0.9",
]
interactive = [
    "jupyter",
    "matplotlib",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Untagged commits get the next minor version on main and the next patch or release
# candidate on release/X.Y; the default scheme would put main behind its release branch.
raw-options = { version_scheme = "release-branch-semver" }

[tool.hatch.build.hooks.vcs]
version-file = "src/aegiss/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aegiss"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude", ".devcontainer", ".envrc", ".github", ".lychee.toml", ".vscode", "AGENTS.md",
    "CLAUDE.md", "cliff.toml", "codecov.yml", "cspell.json", "flake.lock", "flake.nix", "justfile", "local",
    "nix", "prek.toml", "scripts", "sonar-project.properties", "tools",
]

[tool.uv]
python-preference = "only-managed"
# rebuild the editable install when a tag moves the hatch-vcs version
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]


[tool.pytest.ini_options]
minversion = "8.0"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "--import-mode=importlib",
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "--durations=30",
]
xfail_strict = true
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: mark test as slow (>=1 minute runtime)",
]
required_plugins = ["pytest-cov", "pytest-markdown-docs"]
filterwarnings = [
    "error",
    # pyscf suggests an optional package whenever a basis is looked up by an unknown name
    "ignore:Basis may be available in basis-set-exchange:UserWarning:pyscf",
    # pyscf leaves its temporary chkfiles to the garbage collector; Python 3.14 reports it
    "ignore:Implicitly cleaning up <_TemporaryFileWrapper:ResourceWarning",
]


[tool.coverage]
run.source = ["aegiss"]
relative_files = true
report.exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if (typing\\.)?TYPE_CHECKING:",
    '^\s*\.\.\.',
    "@overload",
]


[tool.ruff]
target-version = "py312"
line-length = 88
# `docs/tutorials` holds the tutorial notebooks; `scripts/` holds local, unversioned
# developer scratch scripts. Both are unlinted — but `docs/scripts/` is checked.
# `.github/scripts/` is the release helper shared by every Algorithmiq repository; it
# stays a copy of the release guide's version rather than following our lint rules.
exclude = ["docs/tutorials", "scripts", ".github/scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D206",    # indent-with-spaces: enforced by the formatter
    "E111",    # indentation-with-invalid-multiple: enforced by the formatter
    "E114",    # indentation-with-invalid-multiple-comment: enforced by the formatter
    "E117",    # over-indented: enforced by the formatter
    "ISC001",  # flake8-implicit-str-concat: conflicts with formatter
    "N803",    # pep8-naming: argument name should be lowercase
    "N806",    # pep8-naming: variable in function should be lowercase
    "PLR0913", # pylint refactor: too many arguments to function call
    "PLR0915", # pylint refactor: too many statements
    "PLR2004", # pylint refactor: magic value used in comparison
    "W191",    # tab-indentation: enforced by the formatter
    "ANN401",  # Any type: needed for pyscf/block2 untyped objects
    "COM812",  # missing-trailing-comma: conflicts with the formatter
    "EM101",   # raw-string-in-exception: plain exception messages are fine
    "EM102",   # f-string-in-exception: plain exception messages are fine
    "PLR0917", # too-many-positional-arguments: positional parameters are public API
    "TRY003",  # raise-vanilla-args: long messages outside the exception class
]
unfixable = [
    "ERA",  # removes commented-out code
    "F401", # removes unused imports
    "F841", # removes unused variables
    "T20",  # removes print statements
]
isort.required-imports = ["from __future__ import annotations"]
flake8-unused-arguments.ignore-variadic-names = true
flake8-annotations.allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "C901", "INP001", "E721", "T20", "SLF001"]
"src/aegiss/cli.py" = ["T20"]  # a CLI is expected to print to stdout
"mol_tagger.py" = ["INP001"]
"main.py" = ["INP001"]
"docs/scripts/*.py" = ["INP001"]  # standalone docs helpers, not an importable package
"tools/**" = ["INP001", "T201"]  # standalone repository helpers
"examples/**" = ["INP001", "T201"]  # runnable scripts that print their results
"tests/**/test_*.py" = ["ANN", "I002"]
"src/aegiss/**/__init__.py" = ["I002"]
"*.ipynb" = ["I002"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 140
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# keep the hand-aligned code blocks of the docs as written
exclude = ["*.md"]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests/conftest.py", "docs/scripts", "main.py", "mol_tagger.py", "tools", "examples"]

# The MolTagger GUI goes through qtpy and pyvistaqt, whose stubs miss most of the Qt enums
# and the pyvista Plotter API that QtInteractor inherits.
[[tool.ty.overrides]]
include = ["src/aegiss/utils/mol_tagger/_window.py", "src/aegiss/utils/mol_tagger/_renderer.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-attribute-override = "ignore"
not-subscriptable = "ignore"
