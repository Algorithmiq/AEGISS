[project]
name = "aegiss"
version = "0.1.0"
description = "AEGISS: Atomic Orbital and Entropy based Guided Inference for Space Selection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "block2==0.5.4rc13",
    "matplotlib>=3.9",
    "pyscf>=2.12.1",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pre-commit>=3",
    "ruff==0.15.6",
]
test = [
    "pytest>=8.2.2,<10.0",
    "pytest-cov>=4.0",
]
interactive = [
    "jupyter",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
extra-index-url = ["https://block-hczhai.github.io/block2-preview/pypi/"]


[tool.pytest.ini_options]
minversion = "8.0"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "--import-mode=importlib",
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "--durations=30",
]
xfail_strict = true
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: mark test as slow (>=1 minute runtime)",
]
required_plugins = ["pytest-cov"]


[tool.coverage]
run.source = ["aegiss"]
relative_files = true
report.exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if (typing\\.)?TYPE_CHECKING:",
    '^\s*\.\.\.',
    "@overload",
]


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["examples"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",
    "W",      # pycodestyle
    "C90",    # mccabe
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "EXE",    # flake8-executable
    "ISC003", # flake8-implicit-str-concat: explicit-string-concatenation
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLOT",   # flake8-slot
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PLC",    # pylint convention
    "PLE",    # pylint error
    "PLR",    # pylint refactor
    "PLW",    # pylint warning
    "FLY",    # flynt
    "NPY",    # NumPy-specific rules
    "PERF",   # perflint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "D206",    # indent-with-spaces: enforced by the formatter
    "E111",    # indentation-with-invalid-multiple: enforced by the formatter
    "E114",    # indentation-with-invalid-multiple-comment: enforced by the formatter
    "E117",    # over-indented: enforced by the formatter
    "ISC001",  # flake8-implicit-str-concat: conflicts with formatter
    "N803",    # pep8-naming: argument name should be lowercase
    "N806",    # pep8-naming: variable in function should be lowercase
    "PLR0913", # pylint refactor: too many arguments to function call
    "PLR0915", # pylint refactor: too many statements
    "PLR2004", # pylint refactor: magic value used in comparison
    "W191",    # tab-indentation: enforced by the formatter
    "T201",    # print: intentional progress output in scientific code
    "ANN401",  # Any type: needed for pyscf/block2 untyped objects
]
unfixable = [
    "ERA",  # removes commented-out code
    "F401", # removes unused imports
    "F841", # removes unused variables
    "T20",  # removes print statements
]
isort.required-imports = ["from __future__ import annotations"]
flake8-unused-arguments.ignore-variadic-names = true
flake8-annotations.allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "C901", "INP001", "E721", "T20"]
"tests/**/test_*.py" = ["ANN", "I002"]
"aegiss/**/__init__.py" = ["I002"]
"*.ipynb" = ["I002"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 140
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
exclude = '''(?x)(
    tests/*
    | examples/*
)'''
files = ["aegiss/**/*.py"]

disallow_any_generics = false
disallow_any_unimported = false
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_optional = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
show_error_context = true
show_column_numbers = true
hide_error_codes = false
pretty = true
show_traceback = true

[[tool.mypy.overrides]]
module = [
    "pyscf.*",
    "block2.*",
    "pyblock2.*",
]
ignore_missing_imports = true
ignore_errors = true


[tool.pyright]
pythonVersion = "3.12"
include = ["aegiss/**/*.py", "tests/**/conftest.py"]
exclude = ["test_*.py", "**/__pycache__"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportGeneralTypeIssues = "information"
reportMissingImports = true
reportMissingTypeStubs = "warning"
reportImportCycles = "information"
reportPrivateUsage = "information"
reportPrivateImportUsage = "information"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryCast = "information"
reportUnnecessaryComparison = "information"
reportUnnecessaryContains = "information"
reportUnnecessaryTypeIgnoreComment = "information"
reportMatchNotExhaustive = "information"
