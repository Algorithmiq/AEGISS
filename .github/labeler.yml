python:
  - changed-files:
    - any-glob-to-any-file:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "*.py"

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

ci:
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "justfile"
      - "prek.toml"

tools:
  - changed-files:
    - any-glob-to-any-file:
      - "tools/**"

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - "uv.lock"
