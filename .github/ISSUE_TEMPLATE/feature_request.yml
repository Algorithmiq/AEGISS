name: Feature request / Enhancement
description: Suggest a new feature or improvement to AEGISS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea clearly.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        What problem does this feature solve, or what use case does it enable?
        Is this related to something that is currently impossible or inconvenient?
      placeholder: I'm trying to do X, but currently I have to work around it by doing Y…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: A clear description of the feature or change you'd like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Active space selection (entropy screening / AO projection)
        - Initial guess and SCF
        - Wavefunction and DMRG
        - Orbital localization and natural orbitals
        - MolTagger interactive viewer
        - Plotting and orbital visualization
        - Configuration and CLI
        - Documentation and tutorials
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: api_sketch
    attributes:
      label: Proposed API or usage example (optional)
      description: If applicable, sketch how the feature would look from a user's perspective.
      placeholder: |
        from aegiss import select_aegiss
        # ...

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: |
        Papers, DOIs, or reference implementations describing the method, if the
        request concerns a quantum-chemistry method or selection criterion.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant information, including alternative approaches you considered and why your proposal is preferred.
