name: Bug report
description: Report a bug or unexpected behavior in AEGISS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Minimal script that reproduces the behavior. Please include the molecule
        (geometry or `.xyz`), basis set, charge/spin, and the AEGISS configuration
        objects (`EntropyConfig`, `ProjectionConfig`, `DMRGConfig`, `OutputConfig`)
        you used.
      placeholder: |
        from aegiss import select_aegiss, build_mol, run_scf
        # ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and traceback
      description: |
        Full traceback, plus AEGISS log output. Re-running with
        `configure_logging(level=logging.DEBUG)` gives per-orbital detail.
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (x86_64)
        - Linux (aarch64 / ARM64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: aegiss_version
    attributes:
      label: AEGISS version
      placeholder: "e.g. 0.1.0 — run: uv pip show aegiss (or paste the git commit SHA)"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.7 — run: python --version"
    validations:
      required: true

  - type: input
    id: dependency_versions
    attributes:
      label: PySCF and block2 versions
      placeholder: "e.g. pyscf 2.12.1, block2 0.5.4 — run: uv pip show pyscf block2"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment variables
      description: |
        Values of the AEGISS runtime variables, if you set any:
        `OMP_NUM_THREADS`, `SCRATCH_DIR`, `MEM`, `PYSCF_MAX_MEMORY`, `AEGISS_ORB_BASE`.
      placeholder: |
        OMP_NUM_THREADS=8
        MEM=32

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Orbital plots, screenshots, or any other relevant information.
