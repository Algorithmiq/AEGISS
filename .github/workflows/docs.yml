name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  COLUMNS: 120

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Install package
        run: just build --group docs

      - name: Build docs
        run: just docs

      - name: Run the code blocks in the docs and README
        run: just doctest

      - name: Run the examples
        run: just example

      - name: Check built docs links (including external)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: "--config .lychee.toml 'site/**/*.html'"
          fail: true

  # The site on gh-pages has one version per release plus `dev`, the unreleased docs of
  # main (`just docs-deploy`). Release candidates get none.
  deploy:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')))
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # every deployment pushes to gh-pages: queue them, never cancel one half-way
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Install package
        run: just build --group docs

      - name: Commit as the Actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy the unreleased docs
        if: github.ref == 'refs/heads/main'
        run: just docs-deploy dev

      # vX.Y.Z replaces the docs of X.Y and becomes the default version
      - name: Deploy the release docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          just docs-deploy "${version%.*}" latest
