name: Lint

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # the PR's or merge group's history, so prek can run on a commit range
          fetch-depth: 0

      - name: Set up the build environment
        uses: ./.github/actions/setup

      # ty resolves imports against the project environment
      - name: Install package
        run: just build --all-groups --all-extras

      - name: Run prek
        uses: j178/prek-action@v3.1.0
        env:
          RUFF_OUTPUT_FORMAT: github
          TY_OUTPUT_FORMAT: github
        with:
          # a merge_group event has no pull_request payload; its range spans the PRs queued ahead too
          extra-args: >-
            --from-ref ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
            --to-ref ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
