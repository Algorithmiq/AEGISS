site_name: AEGISS
site_description: Atomic Orbital and Entropy based Guided Inference for Space Selection
site_url: https://algorithmiq.github.io/AEGISS/
repo_url: https://github.com/Algorithmiq/AEGISS
repo_name: Algorithmiq/AEGISS
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_signature_annotations: true
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
    - Overview: tutorials/index.md
    - "01 — SCF & Localization": tutorials/01_scf_and_localization.ipynb
    - "02 — DMRG & Entropy": tutorials/02_dmrg.ipynb
    - "03 — AO Projection": tutorials/03_ao_projection.ipynb
    - "04 — Full Pipeline": tutorials/04_aegiss.ipynb
  - MolTagger: moltagger.md
  - API Reference:
    - Overview: api/index.md
    - Active Space: api/active_space.md
    - Configuration: api/config.md
    - Initial Guess: api/initial_guess.md
    - Wavefunction: api/wavefunction.md
    - Localization: api/localization.md
    - Utilities: api/utils.md
